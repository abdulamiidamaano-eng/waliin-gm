<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waliin-GM</title>

<script src="/socket.io/socket.io.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef6f1;
  color: #17221d;
}

header {
  background: #087443;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 27px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px #0001;
}

button {
  border: none;
  padding: 12px 15px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
  background: #087443;
  color: white;
  font-size: 15px;
}

button.secondary {
  background: #555;
}

button.danger {
  background: #b3261e;
}

button.gold {
  background: #b8860b;
}

button.blue {
  background: #1769aa;
}

input,
select {
  width: 100%;
  padding: 13px;
  margin: 6px 0 10px;
  border: 1px solid #ccc;
  border-radius: 9px;
}

.hidden {
  display: none !important;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.menu button {
  min-height: 65px;
}

.auth-tabs {
  display: flex;
  gap: 5px;
}

.auth-tabs button {
  flex: 1;
}

.auth-tabs .active {
  background: #055c35;
}

.seats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.seat {
  min-height: 95px;
  border: 2px solid #ddd;
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  background: #fafafa;
}

.seat.occupied {
  border-color: #087443;
  background: #e5f6ec;
}

.seat.owner {
  border-color: #d19b00;
  background: #fff7d6;
}

.listeners {
  padding: 13px;
  background: #eee;
  border-radius: 10px;
  margin-top: 12px;
}

.chat {
  height: 220px;
  overflow-y: auto;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
}

.msg {
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.status {
  padding: 12px;
  border-radius: 10px;
  background: #e7f6ee;
  margin-bottom: 10px;
  font-weight: bold;
}

.request {
  background: #f5f5f5;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
}

.gifts {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.gifts button {
  font-size: 25px;
  margin: 2px;
}

#remoteAudios audio {
  width: 100%;
  margin: 5px 0;
}

.feature-box {
  padding: 15px;
  border-radius: 12px;
  background: #f4f8f5;
  margin-top: 10px;
}

@media(max-width:600px) {
  .seats {
    grid-template-columns: repeat(2, 1fr);
  }

  .menu {
    grid-template-columns: 1fr;
  }

  .gifts {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>💚 WALIIN-GM</header>

<div class="container">

<!-- =========================
     AUTH
========================= -->

<div id="authPage" class="card">

  <h2>🔐 Waliin-GM</h2>

  <div class="auth-tabs">
    <button id="loginTab"
            class="active"
            onclick="showLogin()">
      Seeni
    </button>

    <button id="registerTab"
            onclick="showRegister()">
      Account Uumi
    </button>
  </div>

  <!-- LOGIN -->

  <div id="loginForm">

    <h3>🚪 Sign in</h3>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="loginUser()">
      🔐 Seeni
    </button>

  </div>

  <!-- REGISTER -->

  <div id="registerForm" class="hidden">

    <h3>📝 Register</h3>

    <input
      id="registerUsername"
      placeholder="Username"
    >

    <input
      id="registerEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Password — yoo xiqqaate 6"
    >

    <button onclick="registerUser()">
      📝 Account Uumi
    </button>

  </div>

  <div id="authMessage"></div>

</div>


<!-- =========================
     HOME
========================= -->

<div id="homePage" class="hidden">

  <div class="card">

    <h2>
      🏠 Home
    </h2>

    <p>
      👤 Baga nagaan dhuftan,
      <b id="userDisplay"></b>
    </p>

    <div class="menu">

      <button onclick="openClubCreator()">
        ➕ Create Club
      </button>

      <button onclick="showJoin()">
        🚪 Join Club
      </button>

      <button onclick="showInfo('💬 Chat')">
        💬 Chat
      </button>

      <button onclick="showInfo('🎥 Video Room')">
        🎥 Video Room
      </button>

      <button onclick="showInfo('📞 Call')">
        📞 Call
      </button>

      <button onclick="showInfo('👥 Club')">
        👥 Club
      </button>

      <button onclick="showInfo('❤️ Follow')">
        ❤️ Follow
      </button>

      <button onclick="showInfo('🔎 Search')">
        🔎 Search
      </button>

      <button onclick="showInfo('👤 Profile')">
        👤 Profile
      </button>

      <button onclick="showInfo('🔔 Notifications')">
        🔔 Notifications
      </button>

      <button onclick="showInfo('⚙️ Settings')">
        ⚙️ Settings
      </button>

      <button
        class="danger"
        onclick="logoutUser()">
        🚪 Logout
      </button>

    </div>

  </div>


  <!-- CREATE CLUB -->

  <div id="clubCreator" class="card hidden">

    <h2>🎙️ Create Voice Club</h2>

    <input
      id="clubName"
      placeholder="Maqaa Club"
    >

    <label>💺 Baay'ina Seat</label>

    <select id="seatCount">

      <option value="10">
        10 Seats
      </option>

      <option value="15">
        15 Seats
      </option>

    </select>

    <button onclick="createClub()">
      ➕ Create Club
    </button>

    <button
      class="secondary"
      onclick="hideCreator()">
      Cufi
    </button>

  </div>


  <!-- JOIN CLUB -->

  <div id="joinBox" class="card hidden">

    <h2>🚪 Join Voice Club</h2>

    <input
      id="joinCode"
      placeholder="Club ID"
    >

    <button onclick="joinClub()">
      🚪 Join
    </button>

    <button
      class="secondary"
      onclick="hideJoin()">
      Cufi
    </button>

  </div>

</div>


<!-- =========================
     VOICE ROOM
========================= -->

<div id="clubPage" class="hidden">

  <div class="card">

    <h2>
      🎙️ <span id="clubTitle"></span>
    </h2>

    <div class="status">

      🔗 Club ID:
      <b id="clubIdText"></b>

      <br><br>

      👥 Members:
      <b id="memberCount">0</b>

    </div>

    <div id="myStatus"></div>

    <button onclick="requestSeat()">
      🙋 Request Seat
    </button>

    <button
      class="secondary"
      onclick="leaveSeat()">
      💺 Leave Seat
    </button>

    <button onclick="toggleMic()">
      🎤 Mic ON/OFF
    </button>

    <button
      class="blue"
      onclick="shareClub()">
      🔗 Share
    </button>

    <button
      class="danger"
      onclick="leaveClub()">
      🚪 Leave Room
    </button>

  </div>


  <!-- SEATS -->

  <div class="card">

    <h3>💺 Voice Seats</h3>

    <div id="seats" class="seats"></div>

    <div class="listeners">

      👂 Listeners:
      <b id="listenerCount">0</b>

    </div>

  </div>


  <!-- GIFTS -->

  <div class="card">

    <h3>🎁 Gifts</h3>

    <p>
      Gift tokko filadhu:
    </p>

    <div class="gifts">

      <button onclick="sendGift('❤️')">
        ❤️
      </button>

      <button onclick="sendGift('🌹')">
        🌹
      </button>

      <button onclick="sendGift('🎁')">
        🎁
      </button>

      <button onclick="sendGift('⭐')">
        ⭐
      </button>

      <button onclick="sendGift('👑')">
        👑
      </button>

    </div>

    <div id="giftStatus"
         class="feature-box">
      🎁 Gift as hin ergamne.
    </div>

  </div>


  <!-- AUDIO -->

  <div class="card">

    <h3>🔊 Sagalee</h3>

    <div id="remoteAudios"></div>

  </div>


  <!-- CHAT -->

  <div class="card">

    <h3>💬 Club Chat</h3>

    <div id="chat" class="chat"></div>

    <input
      id="chatInput"
      placeholder="Ergaa barreessi..."
    >

    <button onclick="sendChat()">
      📤 Ergi
    </button>

  </div>


  <!-- OWNER -->

  <div
    id="adminBox"
    class="card hidden">

    <h3>👑 Owner Control</h3>

    <div id="requests"></div>

  </div>

</div>


<!-- INFO -->

<div
  id="info"
  class="card hidden">
</div>


<script>

const socket = io();

let username = "";
let authToken = "";
let currentClub = null;

let muted = true;
let localStream = null;

const peers = {};


/* =========================
   AUTH UI
========================= */

function showLogin() {

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("registerForm")
    .classList.add("hidden");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");
}


function showRegister() {

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document
    .getElementById("registerTab")
    .classList.add("active");
}


/* =========================
   REGISTER
========================= */

async function registerUser() {

  const user =
    document
      .getElementById("registerUsername")
      .value.trim();

  const email =
    document
      .getElementById("registerEmail")
      .value.trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  if (!user || !email || !password) {

    showAuthMessage(
      "⚠️ Odeeffannoo hunda guuti.",
      true
    );

    return;
  }

  try {

    const response =
      await fetch("/api/register", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          username: user,
          email,
          password
        })

      });

    const data =
      await response.json();

    if (!response.ok) {

      showAuthMessage(
        "❌ " + data.message,
        true
      );

      return;
    }

    authToken = data.token;

    username =
      data.user.username;

    localStorage.setItem(
      "waliinToken",
      authToken
    );

    localStorage.setItem(
      "waliinUsername",
      username
    );

    openHome();

  } catch (error) {

    showAuthMessage(
      "❌ Server waliin wal qunnamtiin hin jiru.",
      true
    );
  }
}


/* =========================
   LOGIN
========================= */

async function loginUser() {

  const email =
    document
      .getElementById("loginEmail")
      .value.trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if (!email || !password) {

    showAuthMessage(
      "⚠️ Email fi password guuti.",
      true
    );

    return;
  }

  try {

    const response =
      await fetch("/api/login", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          email,
          password
        })

      });

    const data =
      await response.json();

    if (!response.ok) {

      showAuthMessage(
        "❌ " + data.message,
        true
      );

      return;
    }

    authToken =
      data.token;

    username =
      data.user.username;

    localStorage.setItem(
      "waliinToken",
      authToken
    );

    localStorage.setItem(
      "waliinUsername",
      username
    );

    openHome();

  } catch (error) {

    showAuthMessage(
      "❌ Server waliin wal qunnamtiin hin jiru.",
      true
    );
  }
}


function showAuthMessage(
  message,
  error = false
) {

  const box =
    document.getElementById(
      "authMessage"
    );

  box.textContent = message;

  box.style.color =
    error ? "#b3261e" : "#087443";

  box.style.fontWeight =
    "bold";
}


/* =========================
   HOME
========================= */

function openHome() {

  document
    .getElementById("authPage")
    .classList.add("hidden");

  document
    .getElementById("clubPage")
    .classList.add("hidden");

  document
    .getElementById("homePage")
    .classList.remove("hidden");

  document
    .getElementById("userDisplay")
    .textContent = username;
}


/* =========================
   AUTO LOGIN
========================= */

window.addEventListener(
  "load",
  () => {

    const savedToken =
      localStorage.getItem(
        "waliinToken"
      );

    const savedUsername =
      localStorage.getItem(
        "waliinUsername"
      );

    if (
      savedToken &&
      savedUsername
    ) {

      authToken =
        savedToken;

      username =
        savedUsername;

      openHome();
    }
  }
);


/* =========================
   LOGOUT
========================= */

async function logoutUser() {

  if (currentClub) {
    leaveClub();
  }

  try {

    await fetch("/api/logout", {

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({
        token: authToken
      })

    });

  } catch (e) {}

  localStorage.removeItem(
    "waliinToken"
  );

  localStorage.removeItem(
    "waliinUsername"
  );

  authToken = "";
  username = "";

  document
    .getElementById("homePage")
    .classList.add("hidden");

  document
    .getElementById("clubPage")
    .classList.add("hidden");

  document
    .getElementById("authPage")
    .classList.remove("hidden");
}


/* =========================
   CREATE CLUB
========================= */

function openClubCreator() {

  document
    .getElementById("clubCreator")
    .classList.remove("hidden");
}


function hideCreator() {

  document
    .getElementById("clubCreator")
    .classList.add("hidden");
}


function createClub() {

  const name =
    document
      .getElementById("clubName")
      .value.trim();

  const seats =
    Number(
      document
        .getElementById("seatCount")
        .value
    );

  if (!name) {

    alert(
      "Maqaa Club galchi."
    );

    return;
  }

  socket.emit(
    "createClub",
    {
      name,
      seats,
      username
    }
  );
}


/* =========================
   JOIN
========================= */

function showJoin() {

  document
    .getElementById("joinBox")
    .classList.remove("hidden");
}


function hideJoin() {

  document
    .getElementById("joinBox")
    .classList.add("hidden");
}


function joinClub() {

  const clubId =
    document
      .getElementById("joinCode")
      .value.trim();

  if (!clubId) {

    alert(
      "Club ID galchi."
    );

    return;
  }

  socket.emit(
    "joinClub",
    {
      clubId,
      username
    }
  );
}


/* =========================
   CLUB CREATED
========================= */

socket.on(
  "clubCreated",
  data => {

    currentClub = data;

    openClub(data);
  }
);


/* =========================
   JOINED
========================= */

socket.on(
  "joinedClub",
  data => {

    currentClub = data;

    openClub(data);
  }
);


function openClub(data) {

  document
    .getElementById("homePage")
    .classList.add("hidden");

  document
    .getElementById("clubPage")
    .classList.remove("hidden");

  document
    .getElementById("clubTitle")
    .textContent = data.name;

  document
    .getElementById("clubIdText")
    .textContent = data.id;

  document
    .getElementById("chat")
    .innerHTML = "";

  document
    .getElementById("giftStatus")
    .textContent =
      "🎁 Gift as hin ergamne.";
}


/* =========================
   CLUB UPDATE
========================= */

socket.on(
  "clubUpdate",
  data => {

    currentClub = data;

    renderSeats(data);
    renderRequests(data);
    updateMyStatus(data);

    document
      .getElementById("memberCount")
      .textContent =
        data.members.length;

    updateWebRTCConnections(data);
  }
);


/* =========================
   MY STATUS
========================= */

function updateMyStatus(data) {

  const me =
    data.members.find(
      member =>
        member.id === socket.id
    );

  const box =
    document.getElementById(
      "myStatus"
    );

  if (!me) {

    box.innerHTML = "";
    return;
  }

  if (me.owner) {

    box.innerHTML =
      "👑 Ati Owner dha — Seat 1.";

  } else if (me.seat > 0) {

    box.innerHTML =
      "🎤 Ati Speaker dha — Seat " +
      me.seat +
      (me.muted
        ? " 🔇"
        : " 🎙️");

  } else {

    box.innerHTML =
      "👂 Ati Listener dha.";
  }
}


/* =========================
   SEATS
========================= */

function renderSeats(data) {

  const box =
    document.getElementById(
      "seats"
    );

  box.innerHTML = "";

  let speakerCount = 0;

  for (
    let i = 1;
    i <= data.seats;
    i++
  ) {

    const member =
      data.members.find(
        m => m.seat === i
      );

    const div =
      document.createElement(
        "div"
      );

    div.className = "seat";

    if (member) {

      speakerCount++;

      div.classList.add(
        "occupied"
      );

      if (member.owner) {
        div.classList.add(
          "owner"
        );
      }

      div.innerHTML =
        "💺 " + i +
        "<br>👤 " +
        escapeHtml(
          member.username
        ) +
        "<br>" +
        (
          member.muted
            ? "🔇"
            : "🎤"
        ) +
        (
          member.owner
            ? "<br>👑 Owner"
            : ""
        );

      /*
       * OWNER CONTROL
       */

      const me =
        data.members.find(
          m =>
            m.id === socket.id
        );

      if (
        me &&
        me.owner &&
        member.id !== socket.id
      ) {

        const muteButton =
          document.createElement(
            "button"
          );

        muteButton.textContent =
          "🔇 Mute";

        muteButton.onclick =
          () => {

            socket.emit(
              "ownerMute",
              {
                clubId: data.id,
                targetId:
                  member.id
              }
            );
          };

        const removeButton =
          document.createElement(
            "button"
          );

        removeButton.textContent =
          "🚫 Remove";

        removeButton.className =
          "danger";

        removeButton.onclick =
          () => {

            if (
              confirm(
                member.username +
                " remove gochuu?"
              )
            ) {

              socket.emit(
                "removeMember",
                {
                  clubId: data.id,
                  targetId:
                    member.id
                }
              );
            }
          };

        div.appendChild(
          muteButton
        );

        div.appendChild(
          removeButton
        );
      }

    } else {

      div.innerHTML =
        "💺 " + i +
        "<br>Empty";
    }

    box.appendChild(div);
  }

  const listeners =
    data.members.length -
    speakerCount;

  document
    .getElementById(
      "listenerCount"
    )
    .textContent =
      Math.max(
        0,
        listeners
      );
}


/* =========================
   REQUEST
========================= */

function requestSeat() {

  if (!currentClub) return;

  socket.emit(
    "requestSeat",
    {
      clubId:
        currentClub.id
    }
  );

  alert(
    "🙋 Request Owner bira gaheera."
  );
}


/* =========================
   ADMIN REQUESTS
========================= */

function renderRequests(data) {

  const me =
    data.members.find(
      m =>
        m.id === socket.id
    );

  const admin =
    document.getElementById(
      "adminBox"
    );

  if (
    !me ||
    !me.owner
  ) {

    admin.classList.add(
      "hidden"
    );

    return;
  }

  admin.classList.remove(
    "hidden"
  );

  const box =
    document.getElementById(
      "requests"
    );

  box.innerHTML = "";

  if (
    !data.requests ||
    data.requests.length === 0
  ) {

    box.innerHTML =
      "<p>🙅 Request hin jiru.</p>";

    return;
  }

  data.requests.forEach(
    request => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "request";

      row.innerHTML =
        "🙋 " +
        escapeHtml(
          request.username
        );

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        "💺 Seat Kenni";

      button.onclick =
        () => {

          socket.emit(
            "giveSeat",
            {
              clubId:
                data.id,
              targetId:
                request.id
            }
          );
        };

      row.appendChild(
        button
      );

      box.appendChild(
        row
      );
    }
  );
}


/* =========================
   MIC
========================= */

async function toggleMic() {

  if (!currentClub) return;

  const me =
    currentClub.members.find(
      m =>
        m.id === socket.id
    );

  if (
    !me ||
    me.seat === 0
  ) {

    alert(
      "🎤 Dura Seat argachuu qabda."
    );

    return;
  }

  if (!localStream) {

    await startMicrophone();

    return;
  }

  muted = !muted;

  localStream
    .getAudioTracks()
    .forEach(
      track => {
        track.enabled =
          !muted;
      }
    );

  socket.emit(
    "mute",
    {
      clubId:
        currentClub.id,
      muted
    }
  );
}


async function startMicrophone() {

  try {

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true,
          video: false
        });

    muted = false;

    localStream
      .getAudioTracks()
      .forEach(
        track => {
          track.enabled = true;
        }
      );

    socket.emit(
      "mute",
      {
        clubId:
          currentClub.id,
        muted: false
      }
    );

    await updateWebRTCConnections(
      currentClub
    );

  } catch (error) {

    console.error(error);

    alert(
      "🎤 Microphone permission Allow godhi."
    );
  }
}


function stopMicrophone() {

  if (!localStream) return;

  localStream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

  localStream = null;
  muted = true;
}

/* =========================
   WEBRTC
========================= */

async function updateWebRTCConnections(
  data
) {

  if (!localStream) return;

  const speakers =
    data.members.filter(
      m =>
        m.seat > 0 &&
        !m.muted &&
        m.id !== socket.id
    );

  for (
    const member of speakers
  ) {

    if (
      !peers[member.id]
    ) {

      await createPeer(
        member.id
      );
    }
  }
}


async function createPeer(
  targetId
) {

  if (peers[targetId])
    return;

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers[targetId] = pc;

  localStream
    .getTracks()
    .forEach(
      track =>
        pc.addTrack(
          track,
          localStream
        )
    );

  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        socket.emit(
          "webrtc-ice",
          {
            target:
              targetId,
            candidate:
              event.candidate
          }
        );
      }
    };

  pc.ontrack =
    event => {

      let audio =
        document.getElementById(
          "audio-" +
          targetId
        );

      if (!audio) {

        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "audio-" +
          targetId;

        audio.autoplay =
          true;

        document
          .getElementById(
            "remoteAudios"
          )
          .appendChild(
            audio
          );
      }

      audio.srcObject =
        event.streams[0];
    };

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "webrtc-offer",
    {
      target:
        targetId,
      offer
    }
  );
}

/* =========================
   WEBRTC SIGNALS
========================= */

socket.on(
  "webrtc-offer",
  async ({
    sender,
    offer
  }) => {

    if (!localStream)
      return;

    let pc =
      peers[sender];

    if (!pc) {

      pc =
        new RTCPeerConnection({
          iceServers: [
            {
              urls:
                "stun:stun.l.google.com:19302"
            }
          ]
        });

      peers[sender] =
        pc;

      localStream
        .getTracks()
        .forEach(
          track =>
            pc.addTrack(
              track,
              localStream
            )
        );

      pc.onicecandidate =
        event => {

          if (
            event.candidate
          ) {

            socket.emit(
              "webrtc-ice",
              {
                target:
                  sender,
                candidate:
                  event.candidate
              }
            );
          }
        };

      pc.ontrack =
        event => {

          let audio =
            document.getElementById(
              "audio-" +
              sender
            );

          if (!audio) {

            audio =
              document.createElement(
                "audio"
              );

            audio.id =
              "audio-" +
              sender;

            audio.autoplay =
              true;

            document
              .getElementById(
                "remoteAudios"
              )
              .appendChild(
                audio
              );
          }

          audio.srcObject =
            event.streams[0];
        };
    }

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket.emit(
      "webrtc-answer",
      {
        target:
          sender,
        answer
      }
    );
  }
);


socket.on(
  "webrtc-answer",
  async ({
    sender,
    answer
  }) => {

    const pc =
      peers[sender];

    if (!pc) return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        answer
      )
    );
  }
);


socket.on(
  "webrtc-ice",
  async ({
    sender,
    candidate
  }) => {

    const pc =
      peers[sender];

    if (!pc) return;

    try {

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    } catch (error) {

      console.log(error);
    }
  }
);


/* =========================
   LEAVE CLUB
========================= */

function leaveClub() {

  if (!currentClub)
    return;

  socket.emit(
    "leaveClub",
    {
      clubId:
        currentClub.id
    }
  );

  stopMicrophone();

  Object.keys(peers)
    .forEach(
      id => {

        peers[id].close();

        delete peers[id];

      }
    );

  document
    .getElementById(
      "remoteAudios"
    )
    .innerHTML = "";

  currentClub = null;

  document
    .getElementById(
      "clubPage"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "homePage"
    )
    .classList.remove(
      "hidden"
    );
}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}
