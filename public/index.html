<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waliin-GM</title>

<script src="/socket.io/socket.io.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef6f1;
  color: #17221d;
}

header {
  background: #087443;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 27px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px #0001;
}

button {
  border: none;
  padding: 12px 15px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
  background: #087443;
  color: white;
  font-size: 15px;
}

button.secondary {
  background: #555;
}

button.danger {
  background: #b3261e;
}

input,
select {
  width: 100%;
  padding: 13px;
  margin: 6px 0 10px;
  border: 1px solid #ccc;
  border-radius: 9px;
}

.hidden {
  display: none !important;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.menu button {
  min-height: 65px;
}

.seats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.seat {
  min-height: 95px;
  border: 2px solid #ddd;
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  background: #fafafa;
}

.seat.occupied {
  border-color: #087443;
  background: #e5f6ec;
}

.seat.owner {
  border-color: #d19b00;
  background: #fff7d6;
}

.listeners {
  padding: 13px;
  background: #eee;
  border-radius: 10px;
  margin-top: 12px;
}

.chat {
  height: 220px;
  overflow-y: auto;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
}

.msg {
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.status {
  padding: 12px;
  border-radius: 10px;
  background: #e7f6ee;
  margin-bottom: 10px;
  font-weight: bold;
}

.request {
  background: #f5f5f5;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
}

#remoteAudios audio {
  width: 100%;
  margin: 5px 0;
}

@media(max-width:600px) {
  .seats {
    grid-template-columns: repeat(2, 1fr);
  }

  .menu {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>💚 WALIIN-GM</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">

  <h2>🔐 Seensa</h2>

  <input
    id="username"
    placeholder="Maqaa kee galchi"
  >

  <button onclick="login()">
    🚪 Seeni
  </button>

</div>

<!-- HOME -->
<div id="homePage" class="hidden">

  <div class="card">

    <h2>
      👤 <span id="userDisplay"></span>
    </h2>

    <div class="menu">

      <button onclick="openClubCreator()">
        👥 Create Club
      </button>

      <button onclick="showJoin()">
        🚪 Join Club
      </button>

      <button onclick="showInfo('💬 Chat')">
        💬 Chat
      </button>

      <button onclick="showInfo('🎥 Video Room')">
        🎥 Video Room
      </button>

      <button onclick="showInfo('📞 Call')">
        📞 Call
      </button>

      <button onclick="showInfo('❤️ Follow')">
        ❤️ Follow
      </button>

      <button onclick="showInfo('🔎 Search')">
        🔎 Search
      </button>

      <button onclick="logout()">
        🚪 Logout
      </button>

    </div>

  </div>

  <!-- CREATE -->
  <div id="clubCreator" class="card hidden">

    <h2>➕ Create Voice Club</h2>

    <input
      id="clubName"
      placeholder="Maqaa Club"
    >

    <label>💺 Teessoo</label>

    <select id="seatCount">
      <option value="10">10 Seats</option>
      <option value="15">15 Seats</option>
    </select>

    <button onclick="createClub()">
      ➕ Create Club
    </button>

    <button
      class="secondary"
      onclick="hideCreator()"
    >
      Cufi
    </button>

  </div>

  <!-- JOIN -->
  <div id="joinBox" class="card hidden">

    <h2>🚪 Join Club</h2>

    <input
      id="joinCode"
      placeholder="Club ID"
    >

    <button onclick="joinClub()">
      🚪 Join
    </button>

  </div>

</div>

<!-- CLUB -->
<div id="clubPage" class="hidden">

  <div class="card">

    <h2>
      👥 <span id="clubTitle"></span>
    </h2>

    <div class="status">
      🔗 Club ID:
      <span id="clubIdText"></span>
    </div>

    <div id="myStatus"></div>

    <button onclick="requestSeat()">
      🙋 Request Seat
    </button>

    <button
      class="secondary"
      onclick="leaveSeat()"
    >
      💺 Leave Seat
    </button>

    <button onclick="toggleMic()">
      🎤 Mic
    </button>

    <button
      class="danger"
      onclick="leaveClub()"
    >
      🚪 Leave Club
    </button>

  </div>

  <!-- SEATS -->
  <div class="card">

    <h3>💺 Voice Seats</h3>

    <div id="seats" class="seats"></div>

    <div class="listeners">
      👂 Listeners:
      <b id="listenerCount">0</b>
    </div>

  </div>

  <!-- AUDIO -->
  <div class="card">

    <h3>🔊 Sagalee</h3>

    <div id="remoteAudios"></div>

  </div>

  <!-- CHAT -->
  <div class="card">

    <h3>💬 Club Chat</h3>

    <div id="chat" class="chat"></div>

    <input
      id="chatInput"
      placeholder="Ergaa barreessi..."
    >

    <button onclick="sendChat()">
      📤 Ergi
    </button>

  </div>

  <!-- ADMIN -->
  <div id="adminBox" class="card hidden">

    <h3>👑 Seat Requests</h3>

    <div id="requests"></div>

  </div>

</div>

<div id="info" class="card hidden"></div>

<script>

const socket = io();

let username = "";
let currentClub = null;
let muted = true;
let localStream = null;

const peers = {};

function login() {

  username =
    document.getElementById("username")
      .value.trim();

  if (!username) {
    alert("Maqaa kee galchi.");
    return;
  }

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("homePage")
    .classList.remove("hidden");

  document.getElementById("userDisplay")
    .textContent = username;
}

function logout() {

  if (currentClub) {
    leaveClub();
  }

  username = "";

  document.getElementById("homePage")
    .classList.add("hidden");

  document.getElementById("clubPage")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");
}

function openClubCreator() {
  document.getElementById("clubCreator")
    .classList.remove("hidden");
}

function hideCreator() {
  document.getElementById("clubCreator")
    .classList.add("hidden");
}

function showJoin() {
  document.getElementById("joinBox")
    .classList.remove("hidden");
}

function createClub() {

  const name =
    document.getElementById("clubName")
      .value.trim();

  const seats =
    Number(
      document.getElementById("seatCount").value
    );

  socket.emit("createClub", {
    name,
    seats,
    username
  });
}

function joinClub() {

  const clubId =
    document.getElementById("joinCode")
      .value.trim();

  if (!clubId) {
    alert("Club ID galchi.");
    return;
  }

  socket.emit("joinClub", {
    clubId,
    username
  });
}

socket.on("clubCreated", data => {

  currentClub = data;

  alert(
    "🎉 Club uumameera!\n\n" +
    "Club ID: " + data.id +
    "\n\nID kana namoota biraaf qoodi."
  );

  openClub(data);
});

socket.on("joinedClub", data => {

  currentClub = data;

  openClub(data);
});

function openClub(data) {

  document.getElementById("homePage")
    .classList.add("hidden");

  document.getElementById("clubPage")
    .classList.remove("hidden");

  document.getElementById("clubTitle")
    .textContent = data.name;

  document.getElementById("clubIdText")
    .textContent = data.id;
}

socket.on("clubUpdate", data => {

  currentClub = data;

  renderSeats(data);
  renderRequests(data);
  updateMyStatus(data);

  updateWebRTCConnections(data);
});

function updateMyStatus(data) {

  const me =
    data.members.find(
      member => member.id === socket.id
    );

  const box =
    document.getElementById("myStatus");

  if (!me) {
    box.innerHTML = "";
    return;
  }

  if (me.owner) {

    box.innerHTML =
      "👑 Ati Owner dha. Seat 1 siif kenname.";

  } else if (me.seat > 0) {

    box.innerHTML =
      "🎤 Ati Speaker dha — Seat " +
      me.seat;

  } else {

    box.innerHTML =
      "👂 Ati Listener dha.";
  }
}

function renderSeats(data) {

  const box =
    document.getElementById("seats");

  box.innerHTML = "";

  let speakerCount = 0;

  for (let i = 1; i <= data.seats; i++) {

    const member =
      data.members.find(
        m => m.seat === i
      );

    const div =
      document.createElement("div");

    div.className = "seat";

    if (member) {

      speakerCount++;

      div.classList.add("occupied");

      if (member.owner) {
        div.classList.add("owner");
      }

      const mic =
        member.muted
          ? "🔇"
          : "🎤";

      div.innerHTML =
        "💺 " + i +
        "<br>👤 " +
        escapeHtml(member.username) +
        "<br>" + mic +
        (member.owner ? "<br>👑 Owner" : "");

    } else {

      div.innerHTML =
        "💺 " + i +
        "<br>Empty";
    }

    box.appendChild(div);
  }

  const listeners =
    data.members.length - speakerCount;

  document.getElementById("listenerCount")
    .textContent =
    Math.max(0, listeners);
}

function renderRequests(data) {

  const me =
    data.members.find(
      m => m.id === socket.id
    );

  const admin =
    document.getElementById("adminBox");

  if (!me || !me.owner) {

    admin.classList.add("hidden");
    return;
  }

  admin.classList.remove("hidden");

  const box =
    document.getElementById("requests");

  box.innerHTML = "";

  if (!data.requests.length) {

    box.innerHTML =
      "<p>Request hin jiru.</p>";

    return;
  }

  data.requests.forEach(id => {

    const user =
      data.members.find(
        m => m.id === id
      );

    if (!user) return;

    const row =
      document.createElement("div");

    row.className = "request";

    row.innerHTML =
      "👤 " +
      escapeHtml(user.username);

    const button =
      document.createElement("button");

    button.textContent =
      "💺 Seat Kenni";

    button.onclick = () => {

      socket.emit("giveSeat", {
        clubId: data.id,
        targetId: id
      });

    };

    row.appendChild(button);
    box.appendChild(row);
  });
}

function requestSeat() {

  if (!currentClub) return;

  socket.emit("requestSeat", {
    clubId: currentClub.id
  });

  alert(
    "🙋 Request kee Owner bira gaheera."
  );
}

function leaveSeat() {

  if (!currentClub) return;

  socket.emit("leaveSeat", {
    clubId: currentClub.id
  });

  stopMicrophone();
}

async function toggleMic() {

  if (!currentClub) return;

  const me =
    currentClub.members.find(
      m => m.id === socket.id
    );

  if (!me || me.seat === 0) {

    alert(
      "🎤 Mic fayyadamuuf dura Seat argachuu qabda."
    );

    return;
  }

  if (!localStream) {

    await startMicrophone();
    return;
  }

  muted = !muted;

  localStream
    .getAudioTracks()
    .forEach(track => {
      track.enabled = !muted;
    });

  socket.emit("mute", {
    clubId: currentClub.id,
    muted
  });
}

async function startMicrophone() {

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

    muted = false;

    localStream
      .getAudioTracks()
      .forEach(track => {
        track.enabled = true;
      });

    socket.emit("mute", {
      clubId: currentClub.id,
      muted: false
    });

    await updateWebRTCConnections(currentClub);

    alert("🎤 Mic ON");

  } catch (error) {

    console.error(error);

    alert(
      "Microphone hayyama argachuu dide. " +
      "Browser keessatti Microphone permission Allow godhi."
    );
  }
}

function stopMicrophone() {

  if (!localStream) return;

  localStream
    .getTracks()
    .forEach(track => track.stop());

  localStream = null;
  muted = true;

  if (currentClub) {

    socket.emit("mute", {
      clubId: currentClub.id,
      muted: true
    });
  }
}

async function updateWebRTCConnections(data) {

  if (!localStream) return;

  const speakers =
    data.members.filter(
      m =>
        m.seat > 0 &&
        !m.muted &&
        m.id !== socket.id
    );

  for (const member of speakers) {

    if (!peers[member.id]) {

      await createPeer(member.id);
    }
  }

  Object.keys(peers).forEach(id => {

    if (
      !speakers.some(
        member => member.id === id
      )
    ) {

      peers[id].close();
      delete peers[id];

      const audio =
        document.getElementById(
          "audio-" + id
        );

      if (audio) audio.remove();
    }
  });
}

async function createPeer(targetId) {

  if (peers[targetId]) return;

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers[targetId] = pc;

  localStream
    .getTracks()
    .forEach(track => {
      pc.addTrack(track, localStream);
    });

  pc.onicecandidate = event => {

    if (event.candidate) {

      socket.emit("webrtc-ice", {
        target: targetId,
        candidate: event.candidate
      });
    }
  };

  pc.ontrack = event => {

    let audio =
      document.getElementById(
        "audio-" + targetId
      );

    if (!audio) {

      audio =
        document.createElement("audio");

      audio.id =
        "audio-" + targetId;

      audio.autoplay = true;
      audio.controls = false;

      document
        .getElementById("remoteAudios")
        .appendChild(audio);
    }

    audio.srcObject = event.streams[0];
  };

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(offer);

  socket.emit("webrtc-offer", {
    target: targetId,
    offer
  });
}

socket.on(
  "seatGranted",
  async () => {

    alert(
      "🎉 Seat siif kennameera!"
    );

    await startMicrophone();
  }
);

socket.on(
  "newOwner",
  () => {

    alert(
      "👑 Amma ati Club Owner taate."
    );
  }
);

socket.on(
  "webrtc-offer",
  async ({ sender, offer }) => {

    if (!localStream) return;

    let pc = peers[sender];

    if (!pc) {

      pc =
        new RTCPeerConnection({
          iceServers: [
            {
              urls:
                "stun:stun.l.google.com:19302"
            }
          ]
        });

      peers[sender] = pc;

      localStream
        .getTracks()
        .forEach(track => {
          pc.addTrack(
            track,
            localStream
          );
        });

      pc.onicecandidate = event => {

        if (event.candidate) {

          socket.emit("webrtc-ice", {
            target: sender,
            candidate: event.candidate
          });
        }
      };

      pc.ontrack = event => {

        let audio =
          document.getElementById(
            "audio-" + sender
          );

        if (!audio) {

          audio =
            document.createElement("audio");

          audio.id =
            "audio-" + sender;

          audio.autoplay = true;

          document
            .getElementById("remoteAudios")
            .appendChild(audio);
        }

        audio.srcObject =
          event.streams[0];
      };
    }

    await pc.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(answer);

    socket.emit("webrtc-answer", {
      target: sender,
      answer
    });
  }
);

socket.on(
  "webrtc-answer",
  async ({ sender, answer }) => {

    const pc = peers[sender];

    if (!pc) return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(answer)
    );
  }
);

socket.on(
  "webrtc-ice",
  async ({ sender, candidate }) => {

    const pc = peers[sender];

    if (!pc) return;

    try {
      await pc.addIceCandidate(
        new RTCIceCandidate(candidate)
      );
    } catch (error) {
      console.log(error);
    }
  }
);

function sendChat() {

  const input =
    document.getElementById("chatInput");

  const message =
    input.value.trim();

  if (!message || !currentClub) return;

  socket.emit("chatMessage", {
    clubId: currentClub.id,
    message
  });

  input.value = "";
}

socket.on(
  "chatMessage",
  data => {

    const chat =
      document.getElementById("chat");

    const div =
      document.createElement("div");

    div.className = "msg";

    div.innerHTML =
      "<b>" +
      escapeHtml(data.username) +
      ":</b> " +
      escapeHtml(data.message);

    chat.appendChild(div);

    chat.scrollTop =
      chat.scrollHeight;
  }
);

function leaveClub() {

  if (!currentClub) return;

  socket.emit("leaveClub", {
    clubId: currentClub.id
  });

  stopMicrophone();

  Object.keys(peers).forEach(id => {
    peers[id].close();
    delete peers[id];
  });

  document.getElementById("remoteAudios")
    .innerHTML = "";

  currentClub = null;

  document.getElementById("clubPage")
    .classList.add("hidden");

  document.getElementById("homePage")
    .classList.remove("hidden");
}

socket.on(
  "errorMessage",
  message => {
    alert("⚠️ " + message);
  }
);

function showInfo(message) {

  const info =
    document.getElementById("info");

  info.textContent =
    message +
    " — feature kana itti aansee ni qindaa'a.";

  info.classList.remove("hidden");
}

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

</script>

</body>
  </html>
